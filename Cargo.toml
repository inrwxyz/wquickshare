[package]
name = "wquickshare"
version = "0.1.0"
description = "Fast, lightweight, native Rust Quick Share (Nearby Share) engine and CLI for Windows"
authors = ["Inex"]
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
p256 = { version = "0.13", features = ["ecdh", "pem"] }
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
socket2 = "0.5"
mdns-sd = "0.21.7"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
clap = { version = "4", features = ["derive"] }

[features]
default = ["ble"]
ble = []

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Devices_Bluetooth_Advertisement",
    "Storage_Streams",
    "Foundation_Collections",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
